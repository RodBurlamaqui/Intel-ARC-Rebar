name: Hardware-free CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hardware-free checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax (never execute installers)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          for name in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"):
              if not name:
                  continue
              p = pathlib.Path(name)
              if not p.is_file():
                  continue
              first = p.read_bytes().split(b"\n", 1)[0]
              if first.startswith(b"#!") and (b"/bash" in first or b"env bash" in first):
                  subprocess.run(["bash", "-n", name], check=True)
              elif first.startswith(b"#!") and (b"/sh" in first or b"env sh" in first):
                  subprocess.run(["dash", "-n", name], check=True)
          PY
      - name: Ensure BusyBox for Arch runtime-hook tests
        shell: bash
        run: |
          if ! command -v busybox >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y busybox
          fi
      - name: Run mocked regression tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          if not count:
              raise SystemExit("tests/ exists but no tests were discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
          else
            echo "No regression suite on this revision yet; pending PRs add mocked tests."
          fi
      - name: Build Debian package (do not install)
        shell: bash
        run: bash build-deb.sh
