name: Hardware-free CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hardware-free checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax (never execute installers)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          for name in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0"):
              if not name:
                  continue
              p = pathlib.Path(name)
              if not p.is_file():
                  continue
              first = p.read_bytes().split(b"\n", 1)[0]
              if first.startswith(b"#!") and (b"/bash" in first or b"env bash" in first):
                  subprocess.run(["bash", "-n", name], check=True)
              elif first.startswith(b"#!") and (b"/sh" in first or b"env sh" in first):
                  subprocess.run(["dash", "-n", name], check=True)
          PY
      - name: Run mocked regression tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          if not count:
              raise SystemExit("tests/ exists but no tests were discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
          else
            echo "No regression suite on this revision yet; pending PRs add mocked tests."
          fi
      - name: Build Debian package (do not install)
        shell: bash
        run: bash build-deb.sh
      - name: Check the package builds reproducibly
        shell: bash
        run: |
          V=$(grep -m1 '^Version:' debian/control | awk '{print $2}')
          h1=$(sha256sum "dist/arc-rebar_${V}_all.deb" | cut -d' ' -f1)
          # Give every file a new mtime; the package must not change.
          find . -path ./.git -prune -o -type f -exec touch {} +
          bash build-deb.sh >/dev/null
          h2=$(sha256sum "dist/arc-rebar_${V}_all.deb" | cut -d' ' -f1)
          echo "build 1: $h1"; echo "build 2: $h2"
          [ "$h1" = "$h2" ] || { echo "package is not reproducible"; exit 1; }
      - name: Build the Arch and RPM packages (do not install)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pacman-package-manager libarchive-tools fakeroot zstd rpm >/dev/null
          if apt-cache show makepkg >/dev/null 2>&1; then sudo apt-get install -y -qq makepkg >/dev/null; fi
          bash build-arch.sh
          bash build-rpm.sh
      - name: Verify the signed release manifest (when present)
        shell: bash
        run: |
          if [ -f MANIFEST.sha256 ]; then
            tools/verify-manifest.sh
          else
            echo "no MANIFEST.sha256 in this commit (added only for releases)"
          fi
